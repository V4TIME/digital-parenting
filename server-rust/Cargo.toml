[package]
name = "childguard-server"
version = "1.0.0"
edition = "2021"
description = "ChildGuard parent collector server (Rust). Receives events from the Android app and serves the Termux dashboard."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
